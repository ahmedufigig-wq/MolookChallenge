
name: Build Molook Challenge APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q MolookChallenge_Source_v0.1.zip -d extracted
          ls extracted/MolookChallenge

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: extracted/MolookChallenge
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MolookChallenge-APK
          path: extracted/MolookChallenge/app/build/outputs/apk/debug/*.apk
